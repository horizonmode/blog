name: Jest Tests
on:
  workflow_call:

defaults:
  run:
    shell: bash
    working-directory: "./src"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run test
